[project]
name = "tsi-laboratorio-auditoria"
version = "1.0.0"
description = "Laboratorio independiente: auditoria, carga y recuperacion"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
lab = ["pytest>=8,<10", "httpx>=0.27,<1", "locust>=2.27,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
