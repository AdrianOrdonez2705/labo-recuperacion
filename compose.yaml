services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LAB_FAULTS_ENABLED: "true"
      LAB_ADMIN_KEY: "tsi-local-only"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
